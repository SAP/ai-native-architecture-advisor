<?xml version="1.0" encoding="UTF-8"?>
<!--
  SPDX-FileCopyrightText: 2026 SAP SE or an SAP affiliate company and ai-native-architecture-advisor contributors
  SPDX-License-Identifier: Apache-2.0

  AI Native Architecture Advisor — README banner.
  Self-contained animated SVG. No external assets, no runtime.
  Animation uses CSS keyframes; a prefers-reduced-motion block holds a static
  final frame. If a host (e.g. GitHub's image proxy) strips the <style> block,
  the banner degrades gracefully to a crisp static image.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280"
     role="img" aria-label="AI Native Architecture Advisor — North Star, Golden Path, Reference Architectures">
  <title>AI Native Architecture Advisor</title>

  <defs>
    <!-- SAP-tone backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e17"/>
      <stop offset="1" stop-color="#0d1b2e"/>
    </linearGradient>
    <!-- Accent gradient: SAP blue -> teal -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a6ed1"/>
      <stop offset="1" stop-color="#1cc8ee"/>
    </linearGradient>
    <!-- Sweep highlight used across the wordmark -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="wordclip">
      <rect x="470" y="96" width="760" height="64"/>
    </clipPath>
  </defs>

  <style>
    .layer       { opacity: 0.22; }
    .layer-fill  { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
    .tick        { opacity: 0.5; }

    @keyframes rise  { 0%,8% { opacity:.22 } 20%,92% { opacity:1 } 100% { opacity:.22 } }
    @keyframes fill  { 0%,8% { transform:scaleX(0) } 24%,92% { transform:scaleX(1) } 100% { transform:scaleX(0) } }
    @keyframes glide { 0% { transform:translateX(-820px) } 60%,100% { transform:translateX(820px) } }
    @keyframes blink { 0%,45% { opacity:1 } 50%,95% { opacity:0 } 100% { opacity:1 } }

    /* Each layer bar rises + fills, staggered top -> bottom (UX first). */
    .L1 { animation: rise 4.8s ease-in-out infinite; }
    .L1 .layer-fill { animation: fill 4.8s ease-in-out infinite; }
    .L2 { animation: rise 4.8s ease-in-out .35s infinite; }
    .L2 .layer-fill { animation: fill 4.8s ease-in-out .35s infinite; }
    .L3 { animation: rise 4.8s ease-in-out .70s infinite; }
    .L3 .layer-fill { animation: fill 4.8s ease-in-out .70s infinite; }
    .L4 { animation: rise 4.8s ease-in-out 1.05s infinite; }
    .L4 .layer-fill { animation: fill 4.8s ease-in-out 1.05s infinite; }

    .sweep-bar  { animation: glide 4.8s ease-in-out infinite; }
    .cursor     { animation: blink 1.1s steps(1) infinite; }

    @media (prefers-reduced-motion: reduce) {
      .layer      { opacity: 1; }
      .layer-fill { transform: scaleX(1); }
      .L1,.L2,.L3,.L4,.L1 .layer-fill,.L2 .layer-fill,.L3 .layer-fill,.L4 .layer-fill,
      .sweep-bar,.cursor { animation: none; }
      .sweep-bar  { opacity: 0; }
      .cursor     { opacity: 1; }
    }
  </style>

  <!-- Backdrop -->
  <rect width="1280" height="280" fill="url(#bg)"/>

  <!-- Subtle grid texture -->
  <g stroke="#1cc8ee" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="70"  x2="1280" y2="70"/>
    <line x1="0" y1="140" x2="1280" y2="140"/>
    <line x1="0" y1="210" x2="1280" y2="210"/>
  </g>

  <!-- Corner frame ticks -->
  <g class="tick" stroke="#1cc8ee" stroke-width="2" fill="none">
    <path d="M28 24 h28 M28 24 v28"/>
    <path d="M1252 24 h-28 M1252 24 v28"/>
    <path d="M28 256 h28 M28 256 v-28"/>
    <path d="M1252 256 h-28 M1252 256 v-28"/>
  </g>

  <!-- Left mark: four North Star layers, top -> bottom:
       User Experience, Process, Foundation, Platform.
       Fill order follows the stack top-to-bottom (UX first). -->
  <!-- Labels sit to the right of each bar; bars fill left->right on loop. -->
  <g font-family="'SF Mono','DejaVu Sans Mono',Consolas,monospace" font-size="13" letter-spacing="1.5">
    <g class="L1 layer">
      <rect x="80" y="70"  width="300" height="22" rx="3" fill="#13263d"/>
      <rect class="layer-fill" x="80" y="70"  width="300" height="22" rx="3" fill="url(#accent)" opacity="0.9"/>
      <text x="92" y="86" fill="#eaf6ff">USER EXPERIENCE</text>
    </g>
    <g class="L2 layer">
      <rect x="80" y="106" width="300" height="22" rx="3" fill="#13263d"/>
      <rect class="layer-fill" x="80" y="106" width="300" height="22" rx="3" fill="url(#accent)" opacity="0.9"/>
      <text x="92" y="122" fill="#eaf6ff">PROCESS</text>
    </g>
    <g class="L3 layer">
      <rect x="80" y="142" width="300" height="22" rx="3" fill="#13263d"/>
      <rect class="layer-fill" x="80" y="142" width="300" height="22" rx="3" fill="url(#accent)" opacity="0.9"/>
      <text x="92" y="158" fill="#eaf6ff">FOUNDATION</text>
    </g>
    <g class="L4 layer">
      <rect x="80" y="178" width="300" height="22" rx="3" fill="#13263d"/>
      <rect class="layer-fill" x="80" y="178" width="300" height="22" rx="3" fill="url(#accent)" opacity="0.9"/>
      <text x="92" y="194" fill="#eaf6ff">PLATFORM</text>
    </g>
  </g>

  <!-- Vertical divider -->
  <line x1="430" y1="60" x2="430" y2="220" stroke="#1cc8ee" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Right: wordmark -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="470" y="138" font-size="52" font-weight="800" letter-spacing="1.5" fill="#ffffff">AI NATIVE</text>
    <text x="470" y="190" font-size="52" font-weight="800" letter-spacing="1.5" fill="url(#accent)">ARCHITECTURE ADVISOR<tspan class="cursor" dx="6" fill="#1cc8ee">_</tspan></text>

    <!-- Sweep highlight passes across the wordmark area -->
    <g clip-path="url(#wordclip)">
      <rect class="sweep-bar" x="0" y="96" width="180" height="64" fill="url(#sweep)"/>
    </g>

    <!-- Subtitle strip -->
    <g>
      <rect x="470" y="212" width="470" height="26" rx="4" fill="#0a6ed1" fill-opacity="0.14"/>
      <text x="482" y="230" font-family="'SF Mono','DejaVu Sans Mono',Consolas,monospace"
            font-size="13" letter-spacing="2" fill="#9fd8ef">NORTH STAR · GOLDEN PATH · REFERENCE ARCHITECTURES</text>
    </g>
  </g>
</svg>
