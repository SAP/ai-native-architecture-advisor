# Persists GitHub repo traffic (clones + views) past the 14-day API window.
#
# GitHub's Insights -> Traffic only keeps the last 14 days. This workflow runs
# weekly, reads the traffic API, and merges each day's counts into committed
# CSV files under metrics/ so the history accrues indefinitely. De-dupes by
# date, so re-runs never double-count.
#
# Clones are the best available proxy for Claude Code / Codex installs, since
# both do a `git clone` of the repo when the plugin marketplace is added.
name: traffic-snapshot

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC (off-peak minute, weekly)
  workflow_dispatch: {}   # allow manual runs

permissions:
  contents: write # commit the updated CSVs

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch + merge traffic into metrics/*.csv
        env:
          # The default GITHUB_TOKEN CANNOT read the /traffic API — it returns
          # empty, which previously made this job silently write empty CSVs and
          # "succeed". The traffic API needs a user token with push access, so a
          # PAT with repo scope is stored as the TRAFFIC_TOKEN secret.
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::TRAFFIC_TOKEN secret is not set. The default GITHUB_TOKEN cannot read /traffic; add a PAT (repo scope) as TRAFFIC_TOKEN." >&2
            exit 1
          fi

          mkdir -p metrics

          # Merge helper: $1=api path, $2=json array key, $3=csv file, $4=count field.
          # Fails LOUDLY: an API error or an empty result is a hard failure, so a
          # broken run goes red instead of quietly committing nothing.
          merge() {
            api="$1"; key="$2"; csv="$3"; field="$4"
            [ -f "$csv" ] || echo "date,count,uniques" > "$csv"
            # Raw output (no @csv) so dates are unquoted and the file stays clean.
            if ! gh api "repos/$REPO/traffic/$api" \
                 --jq ".${key}[] | \"\(.timestamp[0:10]),\(.${field}),\(.uniques)\"" \
                 > /tmp/new.csv; then
              echo "::error::gh api traffic/$api failed (token lacks traffic access?)" >&2
              exit 1
            fi
            if [ ! -s /tmp/new.csv ]; then
              echo "::error::traffic/$api returned no rows — expected recent daily data. Check TRAFFIC_TOKEN scope/push access." >&2
              exit 1
            fi
            echo "traffic/$api: $(wc -l < /tmp/new.csv) day-rows fetched"
            echo "::group::DEBUG /tmp/new.csv for $api"
            echo "-- wc -lc --"; wc -lc < /tmp/new.csv
            echo "-- cat -A (show line endings / hidden chars) --"; cat -A /tmp/new.csv
            echo "-- awk NF check (field counts per line) --"; awk -F, '{print NR": NF="NF" ["$0"]"}' /tmp/new.csv
            echo "-- existing csv before merge --"; cat -A "$csv" 2>/dev/null || echo "(no csv)"
            echo "::endgroup::"
            # Merge old + new data rows, keyed by date (last-wins, so an overlapping
            # 14-day window updates existing dates with the latest counts), sort by
            # date, then re-prepend the header. Header is kept out of the sort.
            {
              tail -n +2 "$csv"
              cat /tmp/new.csv
            } | awk -F, 'NF>=3 { rows[$1]=$0 } END { for (k in rows) print rows[k] }' \
              | sort -t, -k1,1 > /tmp/body.csv
            { echo "date,count,uniques"; cat /tmp/body.csv; } > "$csv.tmp"
            mv "$csv.tmp" "$csv"
          }

          merge clones  clones  metrics/clones.csv count
          merge views   views   metrics/views.csv  count

          echo "--- metrics/clones.csv (tail) ---"; tail -5 metrics/clones.csv
          echo "--- metrics/views.csv (tail) ---";  tail -5 metrics/views.csv

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- metrics/; then
            echo "No traffic changes to commit."
          else
            git add metrics/
            git commit -m "chore(metrics): weekly traffic snapshot [skip ci]"
            git push
          fi
