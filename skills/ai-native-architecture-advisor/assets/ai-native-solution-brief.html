  <style>
    :root {
      --ink: #081f3d;
      --body: #263a51;
      --muted: #61758a;
      --line: #d4dde6;
      --blue: #0a6ed1;
      --blue-dark: #0854a0;
      --ux-accent: #7157c9;
      --ux-surface: #eee9ff;
      --process-accent: #4f72c8;
      --process-surface: #e5efff;
      --foundation-accent: #198f97;
      --foundation-surface: #e1f4f4;
      --platform-accent: #0a6ed1;
      --platform-surface: #0a6ed1;
      --paper: #fff;
      --canvas: #f3f6f8;
      /* surface tokens so dark mode can retarget hardcoded light fills */
      --surface-soft: #fbfcfe;
      --surface-tint: #eef4fa;
      --surface-code: #f4f7f9;
      --on-accent: #fff;
    }

    /* ── Dark mode: SAP navy/teal palette (matches the project site) ──
       Light mode is unchanged. Driven by data-theme on <html>; the toggle
       sets it, and the inline script seeds it from localStorage or the OS. */
    :root[data-theme="dark"] {
        --ink: #eaf2fb;          /* headings — near-white, slight blue tint */
        --body: #c5d6e8;         /* body text */
        --muted: #7fa9c9;        /* muted light blue (site --gray-3) */
        --line: rgba(28,200,238,0.18);  /* faint teal hairlines */
        --blue: #1cc8ee;         /* accent → SAP teal (site accent) */
        --blue-dark: #4ad4f2;    /* brighter teal for links on dark */
        --ux-accent: #a78bfa;
        --ux-surface: #1a2440;
        --process-accent: #6d9bf2;
        --process-surface: #152238;
        --foundation-accent: #2fd4c6;
        --foundation-surface: #0f2630;
        --platform-accent: #1cc8ee;
        --platform-surface: #0a6ed1;
        --paper: #0e1826;        /* cards on navy */
        --canvas: #0a0e17;       /* page base (site --ink) */
        --surface-soft: #0f1a29;
        --surface-tint: #11263d;
        --surface-code: #0b1420;
        --on-accent: #04202e;
    }
    /* page gets the site's navy gradient instead of flat canvas */
    :root[data-theme="dark"] body { background: linear-gradient(135deg, #0a0e17 0%, #0d1b2e 100%); background-attachment: fixed; }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      position: relative;
      margin: 0;
      color: var(--body);
      background: var(--canvas);
      font-family: "72", "Segoe UI", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.58;
      letter-spacing: 0;
    }
    /* Subtle blue→purple color splashes: corner bleed + faint mid-page washes. */
    body::before {
      content: "";
      position: fixed;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(46rem 34rem at 100% 0%, rgba(113, 87, 201, .10), rgba(113, 87, 201, 0) 60%),
        radial-gradient(40rem 30rem at 100% 0%, rgba(10, 110, 209, .09), rgba(10, 110, 209, 0) 55%),
        radial-gradient(42rem 32rem at 0% 100%, rgba(113, 87, 201, .08), rgba(113, 87, 201, 0) 58%),
        radial-gradient(34rem 26rem at 22% 40%, rgba(79, 114, 200, .05), rgba(79, 114, 200, 0) 60%),
        radial-gradient(30rem 24rem at 82% 72%, rgba(113, 87, 201, .045), rgba(113, 87, 201, 0) 60%);
    }
    .report { position: relative; z-index: 1; }
    @media print { body::before { display: none; } }
    a { color: var(--blue-dark); }
    a:hover { color: var(--blue); }
    a:focus-visible,
    button:focus-visible {
      outline: 3px solid rgba(10, 110, 209, .32);
      outline-offset: 3px;
    }

    .reading-progress {
      position: fixed;
      z-index: 20;
      top: 0;
      right: 0;
      left: 0;
      height: 3px;
      pointer-events: none;
    }
    .reading-progress span {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--blue);
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
    }

    .back-to-top {
      position: fixed;
      z-index: 20;
      right: 24px;
      bottom: 24px;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(10, 110, 209, .3);
      border-radius: 50%;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 7px 20px rgba(8, 31, 61, .2);
      font: inherit;
      font-size: 23px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .2s ease, transform .2s ease, background-color .18s ease;
    }
    .back-to-top.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .back-to-top:hover { background: var(--blue-dark); }

    .export-pdf {
      position: fixed;
      z-index: 20;
      right: 24px;
      bottom: 80px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border: 1px solid rgba(10, 110, 209, .3);
      border-radius: 22px;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 7px 20px rgba(8, 31, 61, .2);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      transition: background-color .18s ease, box-shadow .18s ease;
    }
    .export-pdf:hover {
      background: var(--blue-dark);
      box-shadow: 0 9px 24px rgba(8, 31, 61, .26);
    }
    .export-pdf svg { width: 16px; height: 16px; }

    .report {
      width: min(1120px, calc(100% - 40px));
      margin: 28px auto 72px;
      background: var(--paper);
      box-shadow: 0 10px 30px rgba(21, 48, 75, .08);
    }
    .report-inner { padding: 0 42px 58px; }
    .loading-message,
    .error-message {
      margin: 0;
      padding: 48px 42px;
      color: var(--muted);
    }
    .error-message strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
    }

    .managed-notice {
      margin: 0 -42px;
      padding: 8px 42px;
      color: #3f5870;
      background: var(--surface-tint);
      border-bottom: 1px solid #d4e7f8;
      font-size: 12px;
      text-align: center;
    }
    .meta {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      gap: 0 14px;
      align-items: center;
      min-height: 50px;
      border-bottom: 1px solid #99a8b8;
      color: #35485d;
      font-size: 12px;
    }
    .meta span:nth-child(2) { justify-self: center; }
    .meta span:nth-child(3) { justify-self: end; }

    /* theme toggle — icon-only, far right of the header meta row */
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
      justify-self: end;
      transition: color .18s ease, border-color .18s ease, background-color .18s ease;
    }
    .theme-toggle:hover { color: var(--blue); border-color: var(--blue); }
    .theme-toggle svg { width: 15px; height: 15px; }
    .theme-toggle .ico-light, .theme-toggle .ico-dark { display: inline-flex; }
    .theme-toggle .ico-dark { display: none; }
    :root[data-theme="dark"] .theme-toggle .ico-dark { display: inline-flex; }
    :root[data-theme="dark"] .theme-toggle .ico-light { display: none; }
    @media print { .theme-toggle { display: none; } }

    .title-block {
      padding: 30px 0 26px;
      border-bottom: 1px solid #aab6c3;
    }
    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 38px;
      font-weight: 700;
      line-height: 1.12;
    }
    .subtitle {
      margin: 6px 0 0;
      color: #536378;
      font-size: 21px;
    }

    .opening-section,
    .optional-section {
      padding: 27px 0;
      border-bottom: 1px solid var(--line);
    }
    .opening-section h2,
    .optional-section h2,
    .architecture-view > h2 {
      margin: 0 0 10px;
      color: var(--blue-dark);
      font-size: 20px;
      line-height: 1.25;
    }
    .opening-section.reimagination {
      padding-top: 30px;
    }
    .opening-section.reimagination > * { max-width: 920px; }

    .architecture-view {
      padding: 29px 0 32px;
      border-bottom: 1px solid var(--line);
    }
    .architecture-intro {
      margin: 0 0 18px;
      color: var(--muted);
    }
    .layer-stack {
      display: grid;
      gap: 5px;
    }
    .layer-band {
      --accent: var(--blue);
      --surface: var(--surface-tint);
      display: grid;
      grid-template-columns: minmax(200px, 290px) 1fr;
      align-items: center;
      min-height: 58px;
      padding: 9px 24px;
      color: var(--ink);
      background: var(--surface);
      text-decoration: none;
      opacity: 0;
      transform: translateY(7px);
      animation: layer-enter .42s ease forwards;
      transition: filter .18s ease, transform .18s ease;
    }
    .layer-band:nth-child(2) { animation-delay: .06s; }
    .layer-band:nth-child(3) { animation-delay: .12s; }
    .layer-band:nth-child(4) { animation-delay: .18s; }
    .layer-band:hover,
    .layer-band:focus-visible {
      color: var(--ink);
      transform: translateY(-1px);
      filter: saturate(1.06);
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .layer-band strong {
      font-size: 17px;
      line-height: 1.25;
    }
    .layer-band span {
      color: #53677c;
      font-size: 13px;
    }
    .layer-band[data-layer="ux"] { --accent: var(--ux-accent); --surface: var(--ux-surface); }
    .layer-band[data-layer="process"] { --accent: var(--process-accent); --surface: var(--process-surface); }
    .layer-band[data-layer="foundation"] { --accent: var(--foundation-accent); --surface: var(--foundation-surface); }
    .layer-band[data-layer="platform"] {
      --accent: var(--platform-accent);
      --surface: var(--platform-surface);
      color: #fff;
    }
    .layer-band[data-layer="platform"] span { color: #fff; }
    .layer-band[data-layer="platform"]:hover,
    .layer-band[data-layer="platform"]:focus-visible { color: #fff; }
    @keyframes layer-enter {
      to { opacity: 1; transform: translateY(0); }
    }

    .layer-review-heading {
      margin: 34px 0 7px;
      color: var(--ink);
      font-size: 23px;
    }
    .layer-review-intro {
      margin: 0 0 22px;
      color: var(--muted);
    }
    .layer-section {
      --accent: var(--blue);
      --surface: var(--surface-tint);
      padding: 0 0 40px;
      border-bottom: 1px solid var(--line);
      scroll-margin-top: 18px;
    }
    .layer-section + .layer-section { padding-top: 28px; }
    .layer-section[data-layer="ux"] { --accent: var(--ux-accent); --surface: linear-gradient(90deg, #eee9ff 0%, #c3b3f0 100%); }
    .layer-section[data-layer="process"] { --accent: var(--process-accent); --surface: linear-gradient(90deg, #e5efff 0%, #b7cbf0 100%); }
    .layer-section[data-layer="foundation"] { --accent: var(--foundation-accent); --surface: linear-gradient(90deg, #e1f4f4 0%, #a9dcdc 100%); }
    .layer-section[data-layer="platform"] { --accent: var(--platform-accent); --surface: linear-gradient(90deg, #0a6ed1 0%, #064a8f 100%); }

    .chapter-band {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
      min-height: 62px;
      margin: 0 0 22px;
      padding: 12px 20px;
      border-radius: 12px;
      color: var(--ink);
      background: var(--surface);
      opacity: .35;
      transform: translateY(7px);
      transition: opacity .38s ease, transform .38s ease;
    }
    .chapter-band::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      border-radius: 0 0 12px 12px;
      background: var(--accent);
      content: "";
      transition: width .65s cubic-bezier(.2, .75, .25, 1) .08s;
    }
    .layer-section.entered .chapter-band {
      opacity: 1;
      transform: translateY(0);
    }
    .layer-section.entered .chapter-band::after { width: 100%; }
    .layer-section[data-layer="platform"] .chapter-band { color: #fff; }
    .layer-section[data-layer="platform"] .chapter-band::after { background: rgba(255, 255, 255, .9); }
    .chapter-band h3 {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
    }
    .chapter-band p {
      margin: 3px 0 0;
      color: #4d647a;
      font-size: 13px;
    }
    .layer-section[data-layer="platform"] .chapter-band p,
    .layer-section[data-layer="platform"] .chapter-count { color: #fff; }
    .chapter-count {
      color: #5d7085;
      font-size: 12px;
      white-space: nowrap;
    }
    .layer-body {
      padding: 0 4px;
      opacity: .28;
      transform: translateY(7px);
      transition: opacity .42s ease .05s, transform .42s ease .05s;
    }
    .layer-section.entered .layer-body {
      opacity: 1;
      transform: translateY(0);
    }

    .markdown-body > :first-child { margin-top: 0; }
    .markdown-body > :last-child { margin-bottom: 0; }
    .markdown-body p { margin: 0 0 12px; }
    /* Lead-in callout pills: "In this solution:" (summary) and "Open items:" (attention). */
    .markdown-body p.callout {
      margin: 14px 0;
      padding: 12px 16px;
      border: 1px solid;
      border-radius: 12px;
      box-shadow: 0 1px 1px rgba(8, 31, 61, .04), 0 14px 30px -22px rgba(8, 31, 61, .5);
    }
    .markdown-body p.callout-solution {
      border-color: rgba(10, 110, 209, .28);
      background: rgba(10, 110, 209, .07);
    }
    .markdown-body p.callout-solution strong { color: var(--blue-dark); }
    .markdown-body p.callout-open {
      border-color: rgba(200, 128, 5, .35);
      background: rgba(240, 165, 20, .1);
    }
    .markdown-body p.callout-open strong { color: #9a5b00; }
    .markdown-body ul,
    .markdown-body ol { margin: 8px 0 14px; padding-left: 22px; }
    .markdown-body li { margin: 3px 0; }
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      margin: 20px 0 7px;
      color: var(--ink);
      font-size: 15px;
    }
    .markdown-body blockquote {
      margin: 15px 0;
      padding: 2px 0 2px 15px;
      border-left: 3px solid #9dbfe1;
      color: #445d74;
    }
    .markdown-body table {
      width: 100%;
      margin: 15px 0;
      border-collapse: collapse;
      font-size: 14px;
    }
    .markdown-body th,
    .markdown-body td {
      padding: 9px 10px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    .markdown-body th {
      color: var(--ink);
      background: var(--surface-code);
      font-weight: 600;
    }
    .markdown-body code {
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--surface-code);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .92em;
    }
    .markdown-body pre {
      overflow: auto;
      padding: 14px;
      background: var(--surface-code);
      border: 1px solid var(--line);
    }
    .markdown-body pre code { padding: 0; background: transparent; }

    .optional-section { padding-top: 32px; }
    .optional-section + .optional-section { padding-top: 28px; }

    /* ── Maturity ladder stepper (per material layer) ── */
    .layer-progression {
      margin: 0 0 20px;
      padding: 16px 18px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-soft);
      box-shadow: 0 1px 1px rgba(8, 31, 61, .04), 0 14px 30px -22px rgba(8, 31, 61, .5);
    }
    .prog-title {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    .prog-explainer {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.5;
    }
    .prog-steps {
      display: flex;
      align-items: flex-start;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .prog-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 0 0 auto;
      padding: 0 6px;
      gap: 5px;
    }
    .prog-role {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .prog-step.is-today .prog-role { color: var(--blue); }
    .prog-step.is-target .prog-role { color: var(--ux-accent); }
    .prog-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      border: 2px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--paper);
      font-size: 12.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .prog-star { font-size: 11px; margin-right: 5px; }
    .prog-step.is-today .prog-chip {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }
    .prog-step.is-rec .prog-chip {
      border-color: var(--blue);
      color: var(--blue-dark);
      box-shadow: 0 0 0 4px rgba(10, 110, 209, .14);
    }
    .prog-step.is-today.is-rec .prog-chip {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 0 0 4px rgba(10, 110, 209, .14);
    }
    .prog-step.is-target .prog-chip {
      border-color: var(--ux-accent);
      border-style: dashed;
      color: var(--ux-accent);
    }
    .prog-step.is-rec.is-target .prog-chip {
      border-style: solid;
      border-color: var(--ux-accent);
      color: var(--ux-accent);
      box-shadow: 0 0 0 4px rgba(113, 87, 201, .14);
    }
    .prog-rail {
      flex: 0 0 44px;
      height: 2px;
      margin-top: 15px;
      align-self: flex-start;
      background: var(--line);
    }
    .prog-rail.is-skip {
      position: relative;
      flex-basis: 56px;
      background: transparent;
      border-top: 2px dashed var(--line);
    }
    .prog-skip-note {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 0 4px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .prog-rail.is-alt {
      background: transparent;
      height: auto;
      margin-top: 8px;
      align-self: flex-start;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }
    .prog-cap-role {
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.03em;
    }
    .prog-captions {
      margin: 12px 0 0;
      padding: 10px 0 0;
      border-top: 1px dashed var(--line);
      font-size: 13px;
      color: var(--body);
    }
    .prog-captions p { margin: 3px 0; }
    .prog-captions strong { color: var(--ink); }
    @media print {
      .layer-progression { break-inside: avoid; }
      .prog-step.is-today .prog-chip { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }

    /* ── Solution Stack — one slab per layer, stacked as strata ──── */
    .stack-groups {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 1px 1px rgba(8, 31, 61, .04), 0 14px 30px -22px rgba(8, 31, 61, .5);
    }
    .stack-group {
      --stack-accent: var(--blue);
      --stack-band: var(--surface-tint);
      --stack-hover: rgba(10, 110, 209, .04);
      background: var(--paper);
    }
    .stack-group[data-layer="ux"] {
      --stack-accent: var(--ux-accent);
      --stack-band: linear-gradient(90deg, #eee9ff 0%, #c3b3f0 100%);
      --stack-hover: rgba(113, 87, 201, .045);
    }
    .stack-group[data-layer="process"] {
      --stack-accent: var(--process-accent);
      --stack-band: linear-gradient(90deg, #e5efff 0%, #b7cbf0 100%);
      --stack-hover: rgba(79, 114, 200, .045);
    }
    .stack-group[data-layer="foundation"] {
      --stack-accent: var(--foundation-accent);
      --stack-band: linear-gradient(90deg, #e1f4f4 0%, #a9dcdc 100%);
      --stack-hover: rgba(25, 143, 151, .045);
    }
    .stack-group[data-layer="platform"] {
      --stack-accent: var(--platform-accent);
      --stack-band: linear-gradient(90deg, #0a6ed1 0%, #064a8f 100%);
      --stack-hover: rgba(10, 110, 209, .045);
    }
    /* Full-bleed band — same layer language as the architecture stack. */

    })();
  </script>
</head>
<body>
  <div class="reading-progress" aria-hidden="true"><span></span></div>
  <button class="export-pdf" type="button" aria-label="Save as PDF" title="Save as PDF">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12"></path>
      <path d="m7 10 5 5 5-5"></path>
      <path d="M5 21h14"></path>
    </svg>
    <span>Save as PDF</span>
  </button>
  <button class="back-to-top" type="button" aria-label="Back to top" title="Back to top">
    <span aria-hidden="true">&#8593;</span>
  </button>

  <main class="report" id="report-root" aria-live="polite">
    <p class="loading-message">Loading AI Native Solution Brief...</p>
  </main>

  <noscript>This report template requires JavaScript to render its Markdown source.</noscript>

  <script>
    const layerDefinitions = [
      { id: "ux", title: "User Experience Layer", label: "Engagement | Experiences" },
      { id: "process", title: "Process Layer", label: "Applications | Workflows | Agents" },
      { id: "foundation", title: "Foundation Layer", label: "AI | Data | Business Context" },
      { id: "platform", title: "Platform Layer", label: "Runtime | Governance | Operations" }
    ];
    const managedArtifactComment = "<!-- Managed artifact: Request changes through the AI Native Architecture Advisor instead of editing this file manually. -->";

    function normalize(value) {
      return String(value || "").trim().replace(/\s+/g, " ").toLowerCase();
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function flattenTokenText(tokens) {
      return (tokens || []).map(token => {
        if (token.tokens) return flattenTokenText(token.tokens);
        return token.text || "";
      }).join("");
    }

    // Return the href of the first link token found anywhere in a token tree, or "".
    function firstLinkHref(tokens) {
      for (const token of tokens || []) {
        if (token.type === "link" && token.href) return token.href;
        if (token.tokens) {
          const nested = firstLinkHref(token.tokens);
          if (nested) return nested;
        }
      }
      return "";
    }

    function tokenText(token) {
      return normalize(flattenTokenText(token.tokens) || token.text || "");
    }

    function getMarkdownParser() {
      if (!globalThis.marked) throw new Error("The Markdown parser did not initialize");
      return globalThis.marked;
    }

    function safeUrl(value) {
      const url = String(value || "").trim();
      if (!url || /[\u0000-\u001f\u007f]/.test(url)) return "";
      try {
        // Match browser URL parsing, including relative links, before allowing
        // a value into href/src. Preserve the original relative destination.
        const parsed = new URL(url, "https://report.invalid/");
        return ["http:", "https:", "mailto:"].includes(parsed.protocol) ? url : "";
      } catch { return ""; }
    }

    function createMarkdownRenderer() {
      const parser = getMarkdownParser();
      const renderer = new parser.Renderer();

      renderer.html = token => escapeHtml(token.text);
      renderer.link = function (token) {
        const label = this.parser.parseInline(token.tokens);
        const href = safeUrl(token.href);
        if (!href) return label;
        const title = token.title ? ` title="${escapeHtml(token.title)}"` : "";
        return `<a href="${escapeHtml(href)}"${title}>${label}</a>`;
      };
      renderer.image = token => {
        const source = safeUrl(token.href);
        const label = escapeHtml(token.text || "Image");
        if (!source) return label;
        const title = token.title ? ` title="${escapeHtml(token.title)}"` : "";
        return `<a href="${escapeHtml(source)}"${title}>${label}</a>`;
      };
      renderer.paragraph = function (token) {
        const inner = this.parser.parseInline(token.tokens);
        // Surface lead-in labels as translucent callout pills so readers notice them.
        const lead = (token.tokens && token.tokens[0] && token.tokens[0].type === "strong")
          ? normalize(flattenTokenText(token.tokens[0].tokens)).replace(/:$/, "")
          : "";
        let cls = "";
        if (lead === "in this solution") cls = "callout callout-solution";
        else if (lead === "open items" || lead === "open item") cls = "callout callout-open";
        return cls ? `<p class="${cls}">${inner}</p>\n` : `<p>${inner}</p>\n`;
      };

      return renderer;
    }

    function renderTokens(tokens) {
      if (!tokens.length) return "";
      const filtered = tokens.filter(t => !(t.type === "code" && t.lang === "architecture_diagram"));
      if (!filtered.length) return "";
      return getMarkdownParser().parser(filtered, { renderer: createMarkdownRenderer() });
    }

    function findHeadingIndex(tokens, depth, title, start = 0, end = tokens.length) {
      for (let index = start; index < end; index += 1) {
        const token = tokens[index];
        if (token.type === "heading" && token.depth === depth && tokenText(token) === normalize(title)) {
          return index;
        }
      }
      return -1;
    }

    function requireHeadingIndex(tokens, depth, title, start = 0, end = tokens.length) {
      const titles = (Array.isArray(title) ? title : [title]).map(normalize);
      const indexes = [];
      for (let index = start; index < end; index += 1) {
        const token = tokens[index];
        if (token.type === "heading" && token.depth === depth && titles.includes(tokenText(token))) {
          indexes.push(index);
        }
      }
      if (!indexes.length) throw new Error(`Missing required heading: ${title}`);
      if (indexes.length > 1) throw new Error(`Duplicate required heading: ${title}`);
      return indexes[0];
    }

    function sectionEnd(tokens, headingIndex, stopDepth) {
      for (let index = headingIndex + 1; index < tokens.length; index += 1) {
        const token = tokens[index];
        if (token.type === "heading" && token.depth <= stopDepth) return index;
      }
      return tokens.length;
    }

    function sectionHtml(tokens, headingIndex, stopDepth) {
      return renderTokens(tokens.slice(headingIndex + 1, sectionEnd(tokens, headingIndex, stopDepth)));
    }

    function readMetadata(tokens, start, end) {
      const matches = [];
      for (let index = start; index < end; index += 1) {
        const token = tokens[index];
        if (token.type === "table"
          && normalize(token.header?.[0]?.text) === "metadata"
          && normalize(token.header?.[1]?.text) === "value") {
          matches.push({ index, table: token });
        }
      }
      if (!matches.length) throw new Error("Missing canonical Metadata/Value table before What This Solves");
      if (matches.length > 1) throw new Error("Duplicate canonical Metadata/Value table");

      const metadata = Object.fromEntries(matches[0].table.rows.map(row => [
        normalize(row[0]?.text),
        String(row[1]?.text || "").trim()
      ]));
      if (!metadata.status) throw new Error("Missing Status row in metadata table");
      if (!metadata["last updated"]) throw new Error("Missing Last updated row in metadata table");
      return { ...metadata, index: matches[0].index };
    }

    // One boundary for generated diagram data. Keep valid content; report omissions.
    function normalizeArchitectureDiagram(input) {
      const warnings = [];
      const record = value => value !== null && typeof value === "object" && !Array.isArray(value);
      if (!record(input)) return { data: null, warnings: ["architecture_diagram must contain a JSON object."] };
      const groups = {
        ux: ["components"], process: ["agents", "assistants", "services", "mcp"],
        foundation: ["ai", "data", "stores"], platform: ["components"],
        marketplace: ["items"], devtools: ["items"]
      };
      function checkKeys(value, allowed, path) {
        Object.keys(value).filter(key => !allowed.includes(key)).forEach(key => {
          warnings.push(`${path}.${key}: unrecognized field; omitted.`);
        });
      }
      function components(value, path) {
        if (value === undefined) return [];
        if (!Array.isArray(value)) {
          warnings.push(`${path}: expected an array; omitted.`);
          return [];
        }
        return value.flatMap((entry, index) => {
          const item = typeof entry === "string" ? { name: entry } : entry;
          const at = `${path}[${index}]`;
          if (!record(item) || typeof item.name !== "string" || !item.name.trim()) {
            warnings.push(`${at}: expected a non-empty name; omitted.`);
            return [];
          }
          checkKeys(item, ["name", "note", "status", "type"], at);
          const clean = { name: item.name.trim() };
          for (const key of ["note", "status", "type"]) {
            if (item[key] === undefined) continue;
            if (typeof item[key] === "string") clean[key] = item[key].trim();
            else warnings.push(`${at}.${key}: expected text; omitted.`);
          }
          return [clean];
        });
      }
      checkKeys(input, [...Object.keys(groups), "external_integrations"], "architecture_diagram");
      const data = {};
      for (const [name, lists] of Object.entries(groups)) {
        let section = input[name];
        if (section !== undefined && !record(section)) warnings.push(`${name}: expected an object; omitted.`);
        section = record(section) ? section : {};
        const isLayer = ["ux", "process", "foundation", "platform"].includes(name);
        checkKeys(section, [...lists, ...(isLayer ? ["progression"] : [])], name);
        data[name] = Object.fromEntries(lists.map(key => [key, components(section[key], `${name}.${key}`)]));
        if (isLayer && section.progression !== undefined) {
          const p = section.progression;
          if (record(p)) checkKeys(p, ["today", "recommended", "target", "captions", "title", "branched"], `${name}.progression`);
          const step = value => ["string", "number"].includes(typeof value) && /^[1-9]\d*[a-z]?$/i.test(value);
          const valid = record(p) && record(p.captions)
            && step(p.recommended) && step(p.target) && (p.today === undefined || step(p.today))
            && (p.title === undefined || typeof p.title === "string")
            && (p.branched === undefined || typeof p.branched === "boolean")
            && Object.entries(p.captions).every(([key, caption]) => step(key) && typeof caption === "string" && caption.trim())
            && [p.today, p.recommended, p.target].filter(value => value !== undefined).every(value => p.captions[value]);
          if (valid) data[name].progression = p;
          else warnings.push(`${name}.progression: incomplete or invalid; the Markdown progression is retained.`);
        }
      }
      data.external_integrations = components(input.external_integrations, "external_integrations");
      return { data, warnings };
    }

    function buildReportModel(markdown) {
      if (!String(markdown || "").trimStart().startsWith(managedArtifactComment)) {
        throw new Error("Missing required managed-artifact comment");
      }
      const tokens = getMarkdownParser().lexer(markdown, { gfm: true });
      const titleIndexes = tokens.reduce((indexes, token, index) => {
        if (token.type === "heading" && token.depth === 1) indexes.push(index);
        return indexes;
      }, []);
      if (!titleIndexes.length) throw new Error("Missing solution title (H1)");
      if (titleIndexes.length > 1) throw new Error("The brief must contain exactly one solution title (H1)");
      const canonicalTitleIndex = titleIndexes[0];
      const subtitleIndexes = tokens.reduce((indexes, token, index) => {
        if (token.type === "blockquote") indexes.push(index);
        return indexes;
      }, []);
      if (!subtitleIndexes.length) throw new Error("Missing proposal label (blockquote)");
      const subtitleIndex = subtitleIndexes[0];
      const titleToken = tokens[canonicalTitleIndex];
      const subtitleToken = tokens[subtitleIndex];
      const title = flattenTokenText(titleToken?.tokens).trim();
      const subtitle = String(subtitleToken?.text || "").trim().replace(/\s+/g, " ");
      if (!title) throw new Error("Missing solution title (H1)");
      if (!subtitle) throw new Error("Missing proposal label (blockquote)");
      if (normalize(subtitle) !== normalize("AI Native Solution Proposal")) {
        throw new Error("The proposal label must be: AI Native Solution Proposal");
      }

      const originalIndex = requireHeadingIndex(tokens, 2, ["Use Case & Problem Statement", "What This Solves"]);
      const reimaginationIndex = requireHeadingIndex(tokens, 2, "The AI-Native Direction");
      const fourLayerIndex = requireHeadingIndex(tokens, 2, ["Proposed Architecture Overview", "Architecture"]);
      const metadata = readMetadata(tokens, 0, originalIndex);
      const preludeHeadings = tokens.reduce((indexes, token, index) => {
        if (token.type === "heading" && token.depth === 2 && index <= fourLayerIndex) indexes.push(index);
        return indexes;
      }, []);
      if (preludeHeadings.length !== 3
        || preludeHeadings[0] !== originalIndex
        || preludeHeadings[1] !== reimaginationIndex
        || preludeHeadings[2] !== fourLayerIndex) {
        throw new Error("What This Solves, The AI-Native Direction, and Architecture must follow the canonical order without additional top-level sections between them");
      }
      if (!(canonicalTitleIndex < subtitleIndex
        && subtitleIndex < metadata.index
        && metadata.index < originalIndex
        && originalIndex < reimaginationIndex
        && reimaginationIndex < fourLayerIndex)) {
        throw new Error("The title, proposal label, metadata, and required sections must follow the canonical order");
      }
      const fourLayerEnd = sectionEnd(tokens, fourLayerIndex, 2);

      const layerIndexes = layerDefinitions.map(definition => ({
        ...definition,
        index: requireHeadingIndex(tokens, 3, definition.title, fourLayerIndex + 1, fourLayerEnd)
      }));

      for (let index = 1; index < layerIndexes.length; index += 1) {
        if (layerIndexes[index].index < layerIndexes[index - 1].index) {
          throw new Error("The four layer headings must follow the canonical order");
        }
      }

      // Parse architecture_diagram fenced block anywhere in the document (needed
      // before the layers so each layer can pick up its progression object).
      let architectureDiagram = null;
      let architectureWarnings = [];
      const diagramBlocks = tokens.filter(token => token.type === "code" && token.lang === "architecture_diagram");
      if (!diagramBlocks.length) architectureWarnings.push("Missing architecture_diagram block; the layer prose is retained.");
      else {
        try {
          const result = normalizeArchitectureDiagram(JSON.parse(diagramBlocks[0].text));
          architectureDiagram = result.data;
          architectureWarnings = result.warnings;
        } catch {
          architectureWarnings.push("Invalid JSON in architecture_diagram; correct it to display the diagram. The layer prose is retained.");
        }
        if (diagramBlocks.length > 1) architectureWarnings.push("Multiple architecture_diagram blocks; only the first is used.");
      }

      // Drop the Markdown "**Progression:** …" paragraph (and its caption list)
      // from a layer's body when the stepper presents the same information.
      function withoutProgressionTokens(layerTokens) {
        const kept = [];
        for (let i = 0; i < layerTokens.length; i += 1) {
          const token = layerTokens[i];
          const lead = (token.type === "paragraph" && token.tokens?.[0]?.type === "strong")
            ? normalize(flattenTokenText(token.tokens[0].tokens)).replace(/:$/, "")
            : "";
          if (lead === "progression") {
            let j = i + 1;
            while (j < layerTokens.length && layerTokens[j].type === "space") j += 1;
            if (j < layerTokens.length && layerTokens[j].type === "list") j += 1;
            i = j - 1;
            continue;
          }
          kept.push(token);
        }
        return kept;
      }

      const firstLayerIndex = Math.min(...layerIndexes.map(layer => layer.index));
      const architectureIntro = renderTokens(tokens.slice(fourLayerIndex + 1, firstLayerIndex));
      const layers = layerIndexes.map((layer, index) => {
        const progression = architectureDiagram?.[layer.id]?.progression || null;
        let layerTokens = tokens.slice(layer.index + 1, layerIndexes[index + 1]?.index || fourLayerEnd);
        if (renderProgressionStepper(progression)) layerTokens = withoutProgressionTokens(layerTokens);
        return {
          id: layer.id,
          title: layer.title,
          label: layer.label,
          progression,
          content: renderTokens(layerTokens)
        };
      });

      const tailHeadingIndexes = tokens.reduce((indexes, token, index) => {
        if (token.type === "heading" && token.depth === 2 && index >= fourLayerEnd) indexes.push(index);
        return indexes;
      }, []);
      const tailSections = tailHeadingIndexes.map(index => {
        const heading = flattenTokenText(tokens[index].tokens).trim();
        const normalizedHeading = normalize(heading);
        const kind = (normalizedHeading === normalize("Services Used") || normalizedHeading === normalize("Solution Stack"))
          ? "capability-fit"
          : normalizedHeading === normalize("Decisions & Open Items")
            ? "open-items"
            : "additional-section";
        const section = {
          title: heading,
          content: sectionHtml(tokens, index, 2),
          kind
        };
        // For the Solution Stack, capture the table rows so we can group by layer
        if (kind === "capability-fit") {
          const end = sectionEnd(tokens, index, 2);
          const tableToken = tokens.slice(index + 1, end).find(t => t.type === "table");
          if (tableToken && tableToken.rows) {
            section.stackRows = tableToken.rows.map(row => ({
              service: flattenTokenText(row[0]?.tokens) || row[0]?.text || "",
              serviceUrl: firstLinkHref(row[0]?.tokens),
              layer: flattenTokenText(row[1]?.tokens) || row[1]?.text || "",
              purpose: flattenTokenText(row[2]?.tokens) || row[2]?.text || ""
            }));
          }
        }
        return section;
      });
      // Selection is authored as an ordered Markdown list, never inferred from
      // product mentions. Invalid entries remain visible as ordinary Markdown.
      let relatedArchitectures = [];
      const relatedIndex = tailHeadingIndexes.find(index => normalize(flattenTokenText(tokens[index].tokens)) === normalize("Related Reference Architectures"));
      if (relatedIndex !== undefined) {
        const body = tokens.slice(relatedIndex + 1, sectionEnd(tokens, relatedIndex, 2)).filter(token => token.type !== "space");
        const list = body.length === 1 && body[0].type === "list" && body[0].ordered ? body[0] : null;
        if (list) {
          const selections = list.items.map(item => {
            const inline = item.tokens?.[0]?.tokens || [];
            const link = inline[0];
            const url = link?.type === "link" ? safeUrl(link.href) : null;
            if (!url || !/^https:\/\//i.test(url) || item.tokens.length !== 1) return null;
            const title = flattenTokenText(link.tokens).trim();
            const description = flattenTokenText(inline.slice(1)).replace(/^\s*[:—–-]\s*/, "").trim();
            return title && description ? { title, url, description } : null;
          });
          if (selections.length && selections.every(Boolean)) {
            relatedArchitectures = selections;
            tailSections.find(section => normalize(section.title) === normalize("Related Reference Architectures")).kind = "related-architectures";
          }
        }
      }
      const capabilitySections = tailSections.filter(section => section.kind === "capability-fit");
      const openItemSections = tailSections.filter(section => section.kind === "open-items");
      if (capabilitySections.length > 1) throw new Error("Duplicate optional heading: Services Used / Solution Stack");
      if (openItemSections.length > 1) throw new Error("Duplicate optional heading: Decisions & Open Items");
      if (capabilitySections.length && openItemSections.length
        && tailSections.indexOf(capabilitySections[0]) > tailSections.indexOf(openItemSections[0])) {
        throw new Error("Services Used must appear before Decisions & Open Items");
      }

      return {
        title,
        subtitle,
        status: metadata.status,
        updated: metadata["last updated"],
        originalUseCase: sectionHtml(tokens, originalIndex, 2),
        reimagination: sectionHtml(tokens, reimaginationIndex, 2),
        architectureIntro,
        layers,
        tailSections,
        relatedArchitectures,
        architectureDiagram,
        architectureWarnings
      };
    }

    function renderLayerNavigation(layers) {
      return layers.map(layer => `
        <a class="layer-band" data-layer="${layer.id}" href="#${layer.id}">
          <strong>${escapeHtml(layer.title)}</strong>
          <span>${escapeHtml(layer.label)}</span>
        </a>
      `).join("");
    }

    // Maturity ladder: only the rungs that mean something, as plain level chips.
    // The current level is filled, the North Star is starred; everything else the
    // captions say in words — no status labels.
    function renderProgressionStepper(progression) {
      if (!progression) return "";
      const step = value => /^[1-9]\d*[a-z]?$/i.test(String(value ?? "")) ? String(value) : "";
      const current = step(progression.today);
      const recommended = step(progression.recommended);
      const target = step(progression.target);
      const captions = progression.captions || {};

      const levels = [...new Set([current, recommended, target, ...Object.keys(captions).map(step)].filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      if (!levels.length) return "";
      // Keep the original Markdown if the structured representation is incomplete.
      if (levels.some(level => typeof captions[level] !== "string" || !captions[level].trim())) return "";

      // Role label shown under each chip so the stage is explicit, not colour-only.
      const roleOf = level => level === current ? "Today"
        : level === recommended ? "Recommended next"
        : level === target ? "North Star target" : "";

      const rungs = levels.map(level => {
        const classes = ["prog-step"];
        if (level === current) classes.push("is-today");
        if (level === recommended) classes.push("is-rec");
        if (level === target) classes.push("is-target");
        const star = level === target ? '<span class="prog-star" aria-hidden="true">★ </span>' : "";
        const role = roleOf(level);
        const roleTag = role ? `<span class="prog-role">${role}</span>` : "";
        return `
          <div class="${classes.join(" ")}">
            <span class="prog-chip">${star}Step ${level}</span>
            ${roleTag}
          </div>
        `;
      });
      // Rails: a gap between non-consecutive levels (e.g. 2 → 4) is deliberate —
      // mark it so a skipped step does not read as a missing/broken one.
      const row = rungs.flatMap((rung, index) => {
        if (index >= rungs.length - 1) return [rung];
        const a = parseInt(levels[index], 10), b = parseInt(levels[index + 1], 10);
        if (progression.branched && a === b) {
          return [rung, '<span class="prog-rail is-alt" aria-label="alternative">/</span>'];
        }
        const skips = Number.isFinite(a) && Number.isFinite(b) && b - a > 1;
        return [rung, skips
          ? `<span class="prog-rail is-skip" title="intermediate steps skipped"><span class="prog-skip-note">skips ${b - a - 1}</span></span>`
          : '<span class="prog-rail" aria-hidden="true"></span>'];
      }).join("");

      const captionLines = levels
        .filter(level => captions[level] !== undefined)
        .map(level => {
          const role = roleOf(level);
          const roleLead = role ? `<span class="prog-cap-role">${role} · </span>` : "";
          return `<p><strong>Step ${level}:</strong> ${roleLead}${escapeHtml(String(captions[level]))}</p>`;
        })
        .join("");

      return `
        <div class="layer-progression">
          <p class="prog-title">${escapeHtml(progression.title || "Capability progression")}</p>
          <p class="prog-explainer">Maturity on SAP's AI-native North Star scale (Step 1 = foundational, higher = more AI-native). Only the meaningful stages for this layer are shown — gaps mean intermediate steps are skipped on purpose.</p>
          <div class="prog-steps">${row}</div>
          ${captionLines ? `<div class="prog-captions">${captionLines}</div>` : ""}
        </div>
      `;
    }

    function renderLayerSections(layers) {
      return layers.map((layer, index) => `
        <section class="layer-section" id="${layer.id}" data-layer="${layer.id}" aria-labelledby="${layer.id}-title">
          <header class="chapter-band">
            <div>
              <h3 id="${layer.id}-title">${escapeHtml(layer.title)}</h3>
              <p>${escapeHtml(layer.label)}</p>
            </div>
            <span class="chapter-count">${index + 1} of ${layers.length}</span>
          </header>
          ${renderProgressionStepper(layer.progression)}
          <div class="layer-body markdown-body">${layer.content}</div>
        </section>
      `).join("");
    }

    const STACK_LAYER_ORDER = ["user experience", "process", "foundation", "platform"];
    const STACK_LAYER_META = {
      "user experience": { label: "User Experience", key: "ux" },
      "process":         { label: "Process",         key: "process" },
      "foundation":      { label: "Foundation",      key: "foundation" },
      "platform":        { label: "Platform",        key: "platform" }
    };

    function renderStackGroups(rows) {
      const groups = new Map();
      rows.forEach(row => {
        const parts = row.layer.split(/\s+[—–-]\s+/);
        const norm = normalize(parts[0]);
        const meta = STACK_LAYER_META[norm] || { label: row.layer, key: "other" };
        if (!groups.has(meta.label)) groups.set(meta.label, { key: meta.key, label: meta.label, items: [] });
        groups.get(meta.label).items.push({ ...row, role: STACK_LAYER_META[norm] ? parts.slice(1).join(' — ') : '' });
      });
      const ordered = [...groups.values()].sort((a, b) => {
        const ai = STACK_LAYER_ORDER.indexOf(normalize(a.label));
        const bi = STACK_LAYER_ORDER.indexOf(normalize(b.label));
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      });
      return `<div class="stack-groups">${ordered.map(group => `

      const progress = availableScroll > 0 ? window.scrollY / availableScroll : 0;
      progressBar.style.transform = `scaleX(${Math.min(Math.max(progress, 0), 1)})`;
      backToTop.classList.toggle("is-visible", window.scrollY > 560);

      window.addEventListener("scroll", requestScrollUIUpdate, { passive: true });
      window.addEventListener("resize", requestScrollUIUpdate);
      backToTop.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: reducedMotion.matches ? "auto" : "smooth" });
      });
      if (exportPdf) exportPdf.addEventListener("click", () => window.print());
      updateScrollUI();

      // The theme toggle is injected by renderReport (inside loadReport above),

          if (next === "dark") document.documentElement.setAttribute("data-theme", "dark");

      function buildPlatformRow(d) {
        var plat = d.platform || {};
        var row = el('div', 'platform-row');
        row.appendChild(buildLayerTitle('Platform Layer', 'runtime, identity & operations'));
        var chips = el('div', 'platform-chips');
        plat.components.forEach(function(item) {
          var chip = buildChip(item, 'platform');
          chip.className = 'platform-chip';
          chips.appendChild(chip);
        });
        row.appendChild(chips);
        return row;
      }

      function buildLayerConnector(color, label) {
        var wrap = el('div', 'layer-connector');
        wrap.appendChild(upArrowSvg(color, 22));
        wrap.appendChild(el('span', 'connector-label', label));
        return wrap;
      }

      // Build the diagram div and return it
      var root = el('div', 'arch-diagram');

      var grid = el('div', 'arch-grid');

      var leftCol = el('div', 'layers-col');
      leftCol.appendChild(buildUxLayer(data));
      leftCol.appendChild(buildLayerConnector('#8a7cc8', 'Generate'));
      leftCol.appendChild(buildProcessLayer(data));
      leftCol.appendChild(buildLayerConnector('#7f8ccb', 'Discover'));
      leftCol.appendChild(buildFoundationLayer(data));
      var plat = data.platform || {};
      grid.appendChild(leftCol);

      var rightCol = el('div', 'panels-col');
      var mp = data.marketplace || {};
      var dt = data.devtools || {};
      var external = data.external_integrations || [];
      if (external.length) {
        var externalPanel = buildPanel(null, 'External Integrations', external);
        externalPanel.classList.add('panel--external');
        rightCol.appendChild(externalPanel);
      }
      var marketplaceItems = (mp.items || []).slice();
      if (!marketplaceItems.some(function(item) { return /\bAgent Hub\b/i.test(typeof item === 'string' ? item : item.name); })) {
        marketplaceItems.unshift({name: 'Agent Hub', status: 'Candidate', note: 'Consider discovery and governance for the proposed or later agent scope; availability and product fit remain to confirm.'});
      }
      rightCol.appendChild(buildPanel(marketplaceIcon(), 'Agent & Tools Marketplace', marketplaceItems));
      rightCol.appendChild(buildPanel(devtoolsIcon(), 'Development Tooling', dt.items, 'Development approach to confirm.'));
      grid.appendChild(rightCol);
      root.appendChild(grid);
      if (plat.components.length) {
        root.appendChild(buildPlatformRow(data));
      }

      root.appendChild(tooltip);
      return root;
    }
  </script>
</body>
</html>
